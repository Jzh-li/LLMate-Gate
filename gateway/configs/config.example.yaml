# LLMate Gate 配置示例（对齐《接口与数据契约规范.md》§3.1）
# 用法：./llmate-gate --config ./configs/config.example.yaml

gateway:
  listen: ":8400"                        # 必须以 ':' 开头
  upstream: "https://api.openai.com"     # 必填
  auth_token: "${GATEWAY_AUTH_TOKEN}"    # 客户端访问网关的令牌（支持 ${ENV} 展开）
  # 未配置 auth_token 时（含环境变量展开后为空）：网关自动生成 32 字节随机令牌，
  # 写入 auth_token_file（0600）并在启动日志里打印一次；重启复用同一个令牌，所以
  # 客户端只需配置一次。
  #
  # 为什么不能靠「auth_token 留空」表示「不要鉴权」：无鉴权 + 已配 upstream_api_key
  # 意味着任何能连到端口的人都可以用你的 key 调上游、并按 request_id 还原原文。
  # 因此「不要鉴权」必须是显式声明，不能因为忘写而静默发生。
  # auth_token_file: "./auth_token"
  # allow_unauthenticated: true          # 显式关闭鉴权（仅限不可被他人访问的接口）
  # control_auth_token: "${GATEWAY_CONTROL_TOKEN}"
  #   ↑ 控制面 /v1/privacy/* 的独立令牌。控制面能按 request_id 还原原文，数据面只转发；
  #     给 hooks 的凭据不该同时具备「还原任意历史请求原文」的能力。留空则复用 auth_token。
  upstream_api_key: "${OPENAI_API_KEY}"  # 转发上游时使用的密钥，不透传客户端凭证
  # ⚠️ request_timeout / log_level 目前**尚未生效**（已定义、无读取方）。见 Specs/06 #31。
  request_timeout: "30s"
  debug: true                            # 内嵌调试面板（--no-debug 可彻底关闭）。
                                         # 静态壳仅回环可达；数据接口 /_api/* 需控制面令牌，
                                         # 首次用 http://127.0.0.1:8400/_debug?token=<令牌> 打开一次即可。
  log_level: "info"                      # ⚠️ 尚未生效：改它不会改变任何日志输出

  # 按协议声明的多上游（可选）。网关入口同时暴露 OpenAI 兼容
  # （/v1/chat/completions 等）与 Anthropic 兼容（/v1/messages）两类端点，
  # 不同厂商这两类端点的地址/鉴权/路径前缀都不一样，用这个列表声明各走哪里。
  #   protocol   : openai | anthropic
  #   path_prefix: 替换入口路径的 /v1 段（智谱 GLM 是 /v4，DashScope 是
  #                /compatible-mode/v1；留空则原样透传 /v1）
  #   api_key    : 留空 = 透传模式，客户端自己的鉴权头原样过（gate 前置在
  #                ccswitch 之类的下一跳之前时用这种，gate 不持凭据）
  # 不写 upstreams 时等价于只有一条 openai 上游（即上面的 gateway.upstream）。
  # upstreams:
  #   - protocol: "anthropic"
  #     base_url: "https://api.deepseek.com/anthropic"
  #     api_key: "${DEEPSEEK_API_KEY}"
  #     api_version: "2023-06-01"
  #   - protocol: "openai"
  #     base_url: "https://api.deepseek.com"

detection:
  # pii-engineer : 调用 PII Engineer sidecar（Rust/ONNX，中文 F1 0.918）
  # regex        : 内置中文正则引擎，无需模型，开箱即用（默认）
  engine: "regex"
  # ⚠️ fallback_regex 目前**尚未生效**（已定义、无读取方）：配成 true 也不会让任何实体
  #    绕过模型——engine=pii-engineer 时全部实体仍然进模型。它承诺的是「数据是否送模型」
  #    这条隐私/性能边界，所以别照下面这行推断「格式固定的实体没出机器」。见 Specs/06 #31。
  fallback_regex: true                   # 格式固定实体走正则加速，不进模型（尚未生效）
  sidecar:
    command: "cargo run --release"       # 拉起 PII Engineer
    endpoint: "http://127.0.0.1:8000"
    healthz: "/healthz"
    # ⚠️ 以下三个键目前**尚未生效**：网关从不 exec 任何子进程，只按 endpoint 连接既有
    #    服务。因此 auto_start=true 不会启动子进程，start_timeout / restart_limit 也没有
    #    可作用的监督逻辑。见 Specs/06 #31。
    start_timeout: "60s"
    restart_limit: 3
    auto_start: false                    # true 时由网关 exec 拉起子进程（尚未生效）
  thresholds:                            # score >= 阈值才脱敏
    zh_person_name: 0.5
    zh_phone: 0.8
    zh_id_card: 0.9
    zh_bank_card: 0.9
    zh_address: 0.6
    email: 0.7
  cache:
    enabled: true
    bind_conversation: true              # 缓存键强制绑定 conversation_id
    ttl: "30m"
    max_entries: 10000
  # 登记表：把你自己的真实 PII 值报给网关，出现即脱敏。
  #
  # 中文姓名、自定义地址这类值没有格式约束，统计模型给不出召回保证；登记表是
  # 精确匹配的兜底，命中即脱敏，且不受 thresholds 限制。
  # 与仿真词典的分工：登记表决定「能不能认出来」，词典决定「换成什么假值」。
  #
  # ⚠️ 值本身不写在这里，只在 path 指向的文件里——那是明文 PII，权限 0600，
  #    不要提交进版本库、不要放共享目录。
  #
  # 也可以直接在调试面板「规则」页维护（保存即落盘 + 热加载，无需重启）。
  # registry:
  #   enabled: true
  #   path: "./registry.yaml"

replacement:
  # placeholder : <<zh_person_name_1>> 式占位符
  # simulate    : 格式保持的仿真值（张三 → 李雷）
  # bypass      : 整条请求原样透传，完全不脱敏（只适合本机调试/前置拓扑）
  strategy: "placeholder"
  simulate_zh:
    person_name: true
    phone: true
    id_card: true
    bank_card: true
    # 自定义词典：entity_type → (真实值 → 仿真值)。命中者直接用你给的仿真值，
    # 未命中回落内置词表 + HMAC 派生。只在 strategy=simulate 时生效。
    #
    # ⚠️ 仿真值必须全局唯一（跨类型也算）。还原表是 `map[哨兵串]原值` 一张平表、
    #    不分类型分桶，两个真实值共用一个仿真值会互相覆盖，导致其中一个永久
    #    还原不回来。网关在配置加载期就会拒绝这种配置。
    #
    # 也可以在调试面板「规则」页直接编辑（无需重启），编辑完用「导出」拿到
    # YAML 片段粘回这里即可持久化。
    # dictionary:
    #   zh_person_name:
    #     "张三": "王晓明"
    #     "李四": "陈静"
    #   zh_address:
    #     "北京市朝阳区建国路 88 号": "上海市浦东新区世纪大道 100 号"
    #
    # 身份卡：dictionary 的糖。按类型声明「我自己的真实值」，网关用固定密钥生成
    # 格式保持、跨重启稳定的仿真值，展开进 dictionary（手写词典优先）。每种类型一个。
    # 不想自己起仿真名、又想让仿真身份稳定可预期时用它。
    # identity_card:
    #   zh_person_name: "张三"
    #   zh_phone: "13800138000"
    #   zh_address: "北京市朝阳区建国路 88 号"
  irreversible:
    - api_key
    - password
    - token

policy:
  fail_closed: true                      # 检测异常即阻断，绝不裸奔
  # 下面两个键是**历史遗留**，只能为 true（或整行省略）：
  # 它们声称控制的行为——递归扫描 tool_calls 参数 / SSE 缓冲还原——是无条件
  # 执行的，代码从未读过这两个字段。保留键名是为了不打断已发布的配置，
  # 但写 false 会在启动期报错：空转的开关比没有开关更危险。
  tool_call_scan: true                   # 只能为 true
  stream_restore: true                   # 只能为 true

# ── 行为判断层（Judge）────────────────────────────────────────────────────────
# 判断「这段工具调用要不要拦」，而不是「这段文本里有没有 PII」。PII 检测看内容，
# 判断层看动作：打包整个代码仓库、读 .ssh、往非白名单 host 外发……
#
# 前提共识，先读这三条再配：
#
#  1. 模型不出决策，只出证据。后端（规则或本地模型）只给 {category, severity,
#     confidence}；allow / redact / review / block 由本文件的阈值表确定性算出。
#     因此「同输入必同 action」可审计、可进 CI，模型质量只影响 severity 取值。
#  2. 判断层不联网。base_url 只允许本机/内网（回环、10/8、172.16/12、192.168/16…），
#     配公网地址会启动失败。一个用来防数据外泄的组件自己把数据发出去是自相矛盾的。
#  3. 判断器是 BYOM 骨架，不预置模型。你自己选模型，通过 kind: openai 接任意
#     OpenAI 兼容服务（Ollama / llama.cpp server / vLLM / LM Studio / LocalAI…）。
#
# 默认关闭。开启需给 backends（否则启动期报错）；points 默认全关、逐点打开。
judgment:
  enabled: false
  # shadow : 只记指标/日志，绝不改变现有行为（首版强烈建议）
  # enforce: 按 verdict 的动作生效。开之前请先用 judge-bench 拿到漏报/误报口径——
  #          没有这个口径，「拦住的是不是该拦」是不可知的。
  mode: "shadow"
  fail_closed: true                      # 判断层整体不可用时 → review（交人），不是放行
  timeout: "300ms"                       # 单次判定预算；超时 ⇒ 降级下个后端，不是放行
  # 后端列表，顺序 = 降级顺序：语义能力强的在前，确定性规则在最后兜底。
  # 规则后端永不缺席是这套设计的硬保证——它进程内、零依赖、可进 CI 回归。
  # name 不是纯标签：它同时是**该后端阈值表的键**，也会进证据的 engine 字段与指标标签。
  backends:
    - name: "rules"                      # 进程内确定性规则
      kind: "rules"
    # - name: "local"
    #   kind: "openai"                     # 任意 OpenAI 兼容服务
    #   base_url: "http://127.0.0.1:11434/v1"   # Ollama 默认；只允许本机/内网
    #   model: "qwen2.5:7b-instruct"
    #   # 约束解码模式。越强越好：json_schema > gbnf > format > prompt_only。
    #   # 留空按 prompt_only 处理（不假定你的服务受约束），此时解析失败会走 review。
    #   schema_mode: "json_schema"
    #   timeout: "250ms"
  # 阈值表。⚠️ per-backend：confidence 跨模型不可比（同一模型在不同语言上的
  # 置信度都能与准确率脱节），所以每个后端可用自己的 thresholds 覆盖这一段。
  thresholds:
    block: 0.85
    review: 0.55
    redact: 0.30
  # 判断点分开关，默认全关。灰度上线用：先开 tool_params，观察一段时间再加。
  points:
    inbound_text: false                  # 请求入站文本整段判定（v1 预留）
    tool_params: false                   # 工具调用参数判定
    mcp_scan: false                      # MCP 门面参数扫描
    endpoint: false                      # 控制面 /v1/judge 端点
  # 白名单先于一切判断：agent 天天读 .git 是正常开发，命中即放行、不进后端。
  whitelist:
    hosts: ["127.0.0.1", "localhost"]
    tools: []

vault:
  path: "./vault_data"
  # ⚠️ encryption / key_derivation **不可配**：算法写死在 vault 实现里（scrypt → AES-256-GCM），
  #    这两个键取任何值都不改变行为。键保留是为了不打断已发布配置，但只能填下面这两个值
  #    （或省略）——填别的会在启动期报错，而不是被静默接受（Specs/06 #31）。
  encryption: "aes-256-gcm"
  key_derivation: "scrypt"
  request_ttl: "30m"
  # vault.persist 已移除：旧实现用「本次进程随机生成、从不落盘」的密钥加密，
  # 而 Get 只查内存 map、从不读磁盘——配了它只会让磁盘上堆满永远解不开的 .lmgv，
  # 使用者却以为已经持久化。现在写这个键会直接启动失败（而不是假装成功）。
  # 需要跨重启保留映射表时，请先把密钥管理（轮换 / 备份 / 谁能读）想清楚。

audit:
  enabled: true
  path: "./audit.log"
  export: ["pip", "gdpr"]
  log_pii: false                         # 审计默认不记录原文
  max_size_mb: 100                       # 单文件上限，超过轮转为 audit.log.1/.2…；0 = 关闭轮转
  max_backups: 3                         # 保留历史份数
