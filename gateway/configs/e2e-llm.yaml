# E2E 测试：使用内置 regex 检测器 + mock LLM 上游。
# 跑法：mock-llm --listen :8999 &  ;  llmate-gate --config e2e-llm.yaml --listen :8401 &
gateway:
  listen: ":8401"
  upstream: "http://127.0.0.1:8999"
  auth_token: "${GATEWAY_AUTH_TOKEN}"
  upstream_api_key: "mock-llm-no-auth-needed"
  request_timeout: "10s"
  debug: false
  debug_bind: "127.0.0.1"
  log_level: "info"

detection:
  engine: "regex"
  fallback_regex: true
  thresholds:
    zh_person_name: 0.5
    zh_phone: 0.8
    zh_id_card: 0.9
    email: 0.7
  cache:
    enabled: true
    bind_conversation: true
    ttl: "5m"
    max_entries: 1000

replacement:
  strategy: "placeholder"
  irreversible: []

policy:
  fail_closed: true
  tool_call_scan: true
  stream_restore: true

vault:
  path: "./vault_data_e2e"
  encryption: "aes-256-gcm"
  key_derivation: "scrypt"
  request_ttl: "30m"
  persist: false

audit:
  enabled: false
