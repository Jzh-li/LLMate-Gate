name: release

# 触发：推 v*.*.* tag → 跨平台编译 → 创建 GitHub Release + 上传产物
# 不动 ci.yml（CI 与 release 解耦）
# 也支持 workflow_dispatch（手动重发已存在的 tag，便于 CI 配置改动后补救）
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (e.g. v0.1.0). Empty = use current HEAD ref.'
        required: false
        default: ''

permissions:
  contents: write   # 写 release

env:
  GO_VERSION: '1.25.13'
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.google.cn
  CGO_ENABLED: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # tag 模式强制 checkout 到该 tag commit；workflow_dispatch 模式下 checkout 默认 HEAD。
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 跨平台编译
        working-directory: gateway
        run: |
          set -euo pipefail
          # 决定产物里写的版本字符串
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "release tag = $TAG"
          mkdir -p ../dist
          for t in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64 .exe" "windows arm64 .exe"; do
            read goos goarch ext <<<"$t"
            out="../dist/llmate-gate-${goos}-${goarch}${ext}"
            echo "==> ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "$out" ./cmd/llmate-gate
          done
          ( cd ../dist && sha256sum llmate-gate-* > SHA256SUMS )
          cat ../dist/SHA256SUMS

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LLMate Gate ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/llmate-gate-linux-amd64
            dist/llmate-gate-linux-arm64
            dist/llmate-gate-darwin-amd64
            dist/llmate-gate-darwin-arm64
            dist/llmate-gate-windows-amd64.exe
            dist/llmate-gate-windows-arm64.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
