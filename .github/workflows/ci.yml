name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.24'
  GOPROXY: https://proxy.golang.org,direct

jobs:
  verify:
    name: vet & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 依赖完整性
        working-directory: gateway
        run: |
          go mod download
          go mod verify
          # go.mod/go.sum 必须与源码一致，否则 clean checkout 会失败
          go mod tidy -diff

      - name: 静态检查
        working-directory: gateway
        run: go vet ./...

      - name: 单元 + 集成测试
        working-directory: gateway
        run: go test -count=1 ./...

  build:
    name: build binaries
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 构建三个二进制
        working-directory: gateway
        run: |
          mkdir -p ../build
          CGO_ENABLED=0 go build -o ../build/llmate-gate ./cmd/llmate-gate
          CGO_ENABLED=0 go build -o ../build/mock-llm ./cmd/mock-llm
          CGO_ENABLED=0 go build -o ../build/mock-detector ./cmd/mock-detector

      - uses: actions/upload-artifact@v4
        with:
          name: llmate-gate-linux-amd64
          path: |
            build/llmate-gate
            build/mock-llm
            build/mock-detector

  e2e:
    name: e2e & ui smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATEWAY_AUTH_TOKEN: ci-token-12345
      LMGATE_BUILD: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 构建二进制
        working-directory: gateway
        run: |
          mkdir -p ../build
          CGO_ENABLED=0 go build -o ../build/llmate-gate ./cmd/llmate-gate
          CGO_ENABLED=0 go build -o ../build/mock-llm ./cmd/mock-llm
          CGO_ENABLED=0 go build -o ../build/mock-detector ./cmd/mock-detector

      - name: E2E（E1-E8 契约验证）
        run: ./e2e/e2e.sh

      - name: UI 冒烟（D1-D6）
        run: ./e2e/ui_smoke.sh :8400

  coverage:
    name: coverage
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 覆盖率（含子包）
        working-directory: gateway
        run: |
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test.log
          go tool cover -func=coverage.out > coverage.txt
          grep -E '^total:' coverage.txt | tee coverage-total.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            gateway/coverage.out
            gateway/coverage.txt
            gateway/coverage-total.txt
            gateway/test.log

  bench:
    name: bench fixtures
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验 cn-pii-bench fixture
        run: python bench/validate.py
