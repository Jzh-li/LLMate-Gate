name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.13'
  GOPROXY: https://proxy.golang.org,direct

# ✅ 2026-09-12 已采纳「方案①——补齐门禁」（SPEC_ALIGNMENT C13 / Q11 收口）：
#   - verify 加 -race
#   - 新增 vuln（govulncheck）job
#   - coverage 加门槛（total ≥ 35% + 逐包 ≥ 基线-5pct）
#   - 新增 lint（golangci-lint）job：gateway/.golangci.yml 保守规则集，本地已清零
#   - 新增 perf job：Go benchmark（detector/cache/vault/replacer 热路径）
#     + scripts/bench-guard.sh 回退守门（min-of-6 ns/op，容差 1.25×）
#
# ✅ 2026-09-15 补齐「跑不起来的守门」：
#   - bench 加 `validate.py --all`（三语料；重复样本为 hard error）+ 评估器自检
#   - 新增 bench-gate：起真实网关，跑 L2 泄漏级 + 真对抗阈值守门（端到端）
#   动机：此前 L2 载体守门与真对抗语料**从未在 CI 里跑过**，
#   「一个不跑的守门等价于没有守门」——L2 的 30 条 regression 就是这样长期被忽略的。
#   详见 Specs/06 的 B-15 / B-16 / B-18。
#
# ✅ 2026-09-15 追加：verify 的失败必须自述。
#   go test 输出 tee 到文件，失败时由 scripts/ci-test-annotate.py 把失败用例名 /
#   DATA RACE 摘要写成 check run 注解。动机：job 日志只对 admin 可见（REST 返回
#   403），外部排查时只能看到 "exit code 1" —— 一个说不出所以然的守门同样等于没有守门。
#   详见 Specs/06 的 B-19。
#
# ✅ 2026-09-15 追加：job 依赖 —— needs 只表达「需要上游产出」，不表达「上游没绿就别跑」。
#   原先除 verify 外 9 个 job 全部 needs: verify，于是 verify 一红它们全部 skipped，
#   一次 CI 只产出一个信号，修复节奏被迫变成「修一个、露一个」：golangci-lint 的一条
#   S1016 从 8bb0dbb 起就存在，却因 verify 连续三轮红而被跳过整整三轮（B-19 连带发现 1）。
#   现在唯一的 needs 是 e2e → build（e2e 要跑的是**构建出来的二进制**，属于真实产物依赖）。
#   其余 job 互不依赖，各自报结论。
#   代价考量：本仓是公开仓库，Actions 分钟数不计量，而 10 个 job 并行后总墙钟时间
#   不增反减（原来是「verify 串行 + 其余并行」）。真正的收益是一次红灯给出全部原因。

jobs:
  verify:
    name: vet & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 依赖完整性
        working-directory: gateway
        run: |
          go mod download
          go mod verify
          # go.mod/go.sum 必须与源码一致，否则 clean checkout 会失败
          go mod tidy -diff

      - name: 静态检查
        working-directory: gateway
        run: go vet ./...

      - name: 单元 + 集成测试（含竞态检测）
        working-directory: gateway
        run: |
          # tee 仅为了留下日志给下一步生成注解；set -o pipefail 保证 go test 的
          # 退出码仍是本步骤的退出码，门禁语义不变。
          set -o pipefail
          go test -count=1 -race ./... 2>&1 | tee "${RUNNER_TEMP}/go-test.log"

      - name: 测试失败摘要（写回 check run 注解）
        # 为什么要这一步：job 日志只对仓库 admin 可见（REST 取日志 403
        # "Must have admin rights"），没有日志权限的人只能看到
        # "Process completed with exit code 1." —— 红灯说不出所以然。
        # 注解不依赖日志权限，失败用例名 / 竞态摘要会直接出现在 Checks 面板。
        # 恒不改变构建结论：本步骤只报告，判定失败由上面那一步负责。
        if: failure()
        run: python3 "${GITHUB_WORKSPACE}/scripts/ci-test-annotate.py" "${RUNNER_TEMP}/go-test.log"

  build:
    name: build binaries
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 构建三个二进制
        working-directory: gateway
        run: |
          mkdir -p ../build
          CGO_ENABLED=0 go build -o ../build/llmate-gate ./cmd/llmate-gate
          CGO_ENABLED=0 go build -o ../build/mock-llm ./cmd/mock-llm
          CGO_ENABLED=0 go build -o ../build/mock-detector ./cmd/mock-detector

      - uses: actions/upload-artifact@v6
        with:
          name: llmate-gate-linux-amd64
          path: |
            build/llmate-gate
            build/mock-llm
            build/mock-detector

  e2e:
    name: e2e & ui smoke
    # 全仓唯一的 needs：e2e 跑的是**构建出来的二进制**，这是真实产物依赖。
    # （其余 job 虽也各自构建，但互不依赖——见文件头「job 依赖」。）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATEWAY_AUTH_TOKEN: ci-token-12345
      LMGATE_BUILD: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 构建二进制
        working-directory: gateway
        run: |
          mkdir -p ../build
          CGO_ENABLED=0 go build -o ../build/llmate-gate ./cmd/llmate-gate
          CGO_ENABLED=0 go build -o ../build/mock-llm ./cmd/mock-llm
          CGO_ENABLED=0 go build -o ../build/mock-detector ./cmd/mock-detector

      - name: E2E（E1-E8 契约验证）
        run: ./e2e/e2e.sh

      # 用 timeout 包裹：脚本若卡住，7 分钟后明确非零退出并留下已打印的诊断，
      # 而不是让整个 job 撞超时被 cancel（cancel 会丢日志，导致永远查不到原因）。
      # 脚本内部另有 300s 的 watchdog 会主动 dump 现场。
      - name: UI 冒烟（D1-D6）
        run: timeout -k 5 420 ./e2e/ui_smoke.sh :8400

      # 安全边界回归（S1-S6）。与上面两步同属「组装起来才成立」的行为验证，
      # 因此复用同一个 job 里已构建的二进制；耗时只有几秒。
      # 它守的是「边界还锁不锁得住」，e2e.sh / ui_smoke.sh 守的是「链路还通不通」——
      # 一次把 auth 中间件挂错位置的改动可以让后者全绿、前者全红。
      - name: 自身暴露面（S1-S6 鉴权 / 还原来源 / 调试面板）
        run: timeout -k 5 180 ./e2e/security.sh

  coverage:
    name: coverage
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 覆盖率（含子包）
        working-directory: gateway
        run: |
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test.log
          go tool cover -func=coverage.out > coverage.txt
          grep -E '^total:' coverage.txt | tee coverage-total.txt
          # 门槛 1：total ≥ 35%（基线 41.9%；留 7pct 缓冲供新功能不至于立刻变红）。
          pct=$(awk '/^total:/ {gsub("%","",$3); print $3}' coverage-total.txt)
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 35.0) ? 0 : 1 }' \
            || (echo "::error::覆盖率 ${pct}% 跌破门槛 35%" && exit 1)
          # 门槛 2：逐包 ≥ 基线-5pct（2026-09-12 实测基线见下；无单测的包不设卡，
          # 由 e2e/集成路径覆盖。spec §1.3 高线（detector≥85% 等）为 v1.1 目标，逐步提升）。
          awk '
            /^ok\s+gateway\// {
              pkg=$2; sub(/^gateway\//,"",pkg); sub(/^internal\//,"",pkg); sub(/^pkg\//,"",pkg)
              if (match($0,/coverage: ([0-9.]+)%/,m)) cov[pkg]=m[1]+0
            }
            END {
              split("audit:45 cache:60 config:70 detector:70 mcp:65 metrics:90 policy:90 proxy:50 replacer:75 simulator:70 vault:70 global:80", arr, " ")
              for (i in arr) { split(arr[i], kv, ":"); thr[kv[1]]=kv[2]+0 }
              fail=0
              for (p in thr) {
                if (!(p in cov)) { printf("::error::包 %s 缺失覆盖率输出\n", p); fail=1; continue }
                if (cov[p] < thr[p]) { printf("::error::包 %s 覆盖率 %.1f%% < 门槛 %d%%\n", p, cov[p], thr[p]); fail=1 }
              }
              exit fail
            }
          ' test.log

      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            gateway/coverage.out
            gateway/coverage.txt
            gateway/coverage-total.txt
            gateway/test.log

  bench:
    name: bench fixtures
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # 不引入 setup-python：runner 自带 python3 足够，少一个 Node20 action 依赖
      # --all：三语料（cases / cases_en / cases_adversarial）全查。
      # 重复样本是 **hard error**：同一句话换几个数字批量灌出来的语料会把指标系统性
      # 做虚，必须挡住而不是仅告警。
      - name: 校验 cn-pii-bench fixture（三语料）
        run: |
          python3 -V
          python3 bench/validate.py --all

      # 评估器自身的自检：正确实现 → 0 失败；故意漏实现 → 必须报出大量失败。
      # 没有这一步就无法区分「评估器是瞎的」与「实现是对的」。
      - name: 评估器自检
        run: |
          python3 bench/runner.py --selftest
          python3 bench/carriers.py --selftest --limit 40

  bench-gate:
    name: bench gate (L2 泄漏级 + 真对抗阈值)
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      # 这是**端到端**守门：前面的 bench / bench-baseline 只跑进程内引擎，
      # 打不到「同一段文本出现在同一请求的多个字段」这类载体相关的缺陷
      # （历史上 L2 守门报出的 30 条 regression 正属此类）。
      - name: 构建网关
        working-directory: gateway
        run: CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/llmate-gate" ./cmd/llmate-gate

      - name: 启动网关并等待就绪
        working-directory: gateway
        run: |
          "${RUNNER_TEMP}/llmate-gate" --config configs/bench-gate.yaml --listen :8401 \
            > "${RUNNER_TEMP}/gateway.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:8401/healthz > /dev/null 2>&1; then
              echo "网关就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: 网关 30s 内未就绪，日志："
          cat "${RUNNER_TEMP}/gateway.log"
          exit 1

      # L2 泄漏级：脱敏后的载荷里 PII 原串是否还活着（比 span 级更敏感）。
      # 口径是「相对 flat 基线 0 regression + 往返 0 失败 + 0 请求错误」。
      # ⚠️ 不带 --limit：子集采样会让整类缺陷不可见（银行卡曾因此长期隐身）。
      - name: L2 载体对等性守门
        run: |
          python3 bench/carriers.py \
            --base-url http://127.0.0.1:8401 \
            --out "${RUNNER_TEMP}/bench-reports" \
            --gate

      # 真对抗阈值守门。阈值放在这里而不是脚本里，是为了让「当前承诺的底线」
      # 在 review 中显式可见。基线（2026-09-15）：P=1.0000 R=0.6216 F1=0.7667。
      # 精确率门槛压得很高：误报会改写正常对话内容，比漏检更容易被用户察觉。
      # 召回率低是**已声明的设计边界**（弱格式实体依赖 NER sidecar），
      # 所以只防回归、不设理想值。
      - name: 真对抗阈值守门
        run: |
          python3 bench/bench_runner_adversarial.py \
            --endpoint http://127.0.0.1:8401/v1/privacy/redact \
            --out "${RUNNER_TEMP}/bench-reports" \
            --report \
            --min-precision 0.99 \
            --min-recall 0.60

      - name: 上传 bench 报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-gate-reports
          path: ${{ runner.temp }}/bench-reports
          if-no-files-found: warn

  bench-baseline:
    name: bench baseline (真实引擎召回)
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      # 用真实 RegexEngine 跑语料，量化内置检测引擎的精确率/召回率（Phase 0 立项基线）。
      # 整体召回 < 0.9 时非零退出，作为回归守门（地址等弱格式实体召回受正则启发式限制，
      # 完整召回依赖 pii-engineer NER sidecar，见 DECISION.md）。
      - name: 构建并运行 bench-runner
        working-directory: gateway
        run: |
          CGO_ENABLED=0 go build -o ../build/bench-runner ./cmd/bench-runner
          ../build/bench-runner ../bench/fixtures/cases.jsonl

  lint:
    name: golangci-lint
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    # 曾经写成 needs: verify，代价是 verify 一红 lint 就被跳过：一条 S1016 因此
    # 连续三轮没被看见（Specs/06 B-19 连带发现 1）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      # 静态分析门禁：规则集见 gateway/.golangci.yml（errcheck/govet/staticcheck/
      # unused/ineffassign/misspell/unconvert/copyloopvar，2026-09-12 本地清零）。
      # 固定 golangci-lint v2.6.1：官方 action v9 预编译二进制，避免 go install 受 module
      # go directive 限制；v9 为 Node 24 runtime。v2.13.2 起要求 Go >=1.26。
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.1
          args: --timeout 5m --config .golangci.yml
          working-directory: gateway

  perf:
    name: bench perf guard
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # 仅用于首跑回写 gateway/bench_baseline.txt（自举基线），此后只读比对
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: 运行 Go 基准（count=6 取最小值抗噪声）
        working-directory: gateway
        run: |
          go test -count=6 -run xxx -bench . -benchtime=1s ./internal/... | tee ../bench_current.txt

      - name: 比对基线（或首跑生成）
        run: |
          if [[ -f gateway/bench_baseline.txt ]]; then
            bash scripts/bench-guard.sh gateway/bench_baseline.txt bench_current.txt 1.25
          else
            echo "基线不存在：本次运行生成并回写，下轮起启用回退守门"
            cp bench_current.txt gateway/bench_baseline.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gateway/bench_baseline.txt
            git commit -m "ci: 首跑生成 bench 性能基线（runner 环境实测） [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: bench-current
          path: bench_current.txt

  vuln:
    name: govulncheck
    # 不写 needs: verify —— 见文件头「job 依赖」：门禁各自独立报结论。
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go.sum

      # govulncheck：扫描 Go 工具链已知漏洞。固定 v1.1.4（go.mod go 1.22，兼容
      # CI Go 1.24.9）；v1.2.0 起要求 Go >=1.26。仅当存在「可达」漏洞时非零退出。
      - name: 漏洞扫描
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
